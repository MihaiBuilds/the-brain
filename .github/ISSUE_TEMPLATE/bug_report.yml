name: Bug report
description: Report something that's broken or behaving unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can — vague reports often get parked.

        **Before opening:**
        - Search existing issues to avoid duplicates
        - For setup help or "how do I…" questions, use [Discussions](https://github.com/MihaiBuilds/the-brain/discussions) instead
        - For security vulnerabilities, **do not open an issue** — see [SECURITY.md](https://github.com/MihaiBuilds/the-brain/blob/main/SECURITY.md)

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: When I run workflow X, step Y does Z instead of W.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Step-by-step. The smaller the repro, the faster the fix. A minimal workflow file that triggers the bug is gold.
      placeholder: |
        1. Save the following as `repro.py`:
           ```python
           from src.workflow import Workflow, ShellStep
           workflow = Workflow(name='repro', steps=[ShellStep(name='s', command='…')])
           ```
        2. Run `brain run repro.py`
        3. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: run-id
    attributes:
      label: run_id (if applicable)
      description: Every workflow run has a `run_id` that appears in the structured logs. If the bug happened during a run, paste the ID here so the exact log lines can be located.
      placeholder: e.g. 4f3a9b1c-8d2e-4f6a-9c0b-1d2e3f4a5b6c

  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic bundle
      description: |
        **Run the diagnostic bundler and attach the resulting zip** (drag it into the comment box below — GitHub accepts zip uploads).

        ```bash
        docker compose exec brain brain diagnose
        # or, on the host:
        brain diagnose
        ```

        The bundle includes recent logs, `brain status`, platform info, and Docker state. An allow-listed set of env vars is recorded with values; `DB_PASSWORD`, `LLM_API_KEY`, `MEMORY_VAULT_TOKEN`, and `THE_BRAIN_API_TOKEN` are recorded as presence-only (name only, no value). **Review the zip before posting** — if your workflow logged anything sensitive, scrub it first.

        If you can't run `diagnose` (e.g. the app won't start), paste relevant log lines here instead.
      placeholder: Drag-and-drop the diagnostic zip here, or paste log lines if the bundler can't run.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: The Brain version
      description: Output of `brain --version` or the Docker image tag (e.g. `v1.0.0`).
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running The Brain?
      options:
        - Docker Compose (recommended)
        - Docker (standalone)
        - Local Python (dev)
        - Other (describe in "What happened?")
    validations:
      required: true

  - type: dropdown
    id: trigger
    attributes:
      label: Which trigger fired the run?
      options:
        - manual (`brain run`)
        - cron (scheduler)
        - webhook (HTTP)
        - file (watcher)
        - not applicable (bug isn't run-related)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Host OS
      placeholder: e.g. macOS 14.5, Ubuntu 22.04, Windows 11 + WSL2
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: I reviewed the diagnostic zip for sensitive content before attaching
          required: true
