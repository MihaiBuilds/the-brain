[project]
name = "the-brain"
version = "1.0.1"
description = "Workflow orchestrator for the MihaiBuilds ecosystem"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "MihaiBuilds" },
]
keywords = ["workflow", "orchestration", "automation", "mcp", "ai"]

dependencies = [
    "psycopg[binary]>=3.3.4,<4",
    "psycopg-pool>=3.1,<4",
    "pydantic>=2.5,<3",
    "httpx>=0.28,<1",
    "structlog>=24.1,<27",
    "python-dotenv>=1.2.2",
    "click>=8.1,<9",
    "croniter>=2.0,<7",
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "watchdog>=4.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "freezegun>=1.5,<2",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["content", "logs", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line-length handled by formatter; soft-wrap is fine
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[project.scripts]
brain = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"
